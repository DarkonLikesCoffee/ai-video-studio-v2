version: 2.1

parameters:
  render_video:
    type: boolean
    default: false
  project_path:
    type: string
    default: ""
  composition_id:
    type: string
    default: JumpingCat
  narration_path:
    type: string
    default: ""
  output_name:
    type: string
    default: ai-video-studio-circleci
  request_id:
    type: string
    default: manual

jobs:
  render:
    docker:
      - image: cimg/node:22-browsers
    resource_class: medium
    working_directory: ~/project
    environment:
      PROJECT_PATH: << pipeline.parameters.project_path >>
      COMPOSITION_ID: << pipeline.parameters.composition_id >>
      OUTPUT_NAME: << pipeline.parameters.output_name >>
      NARRATION_PATH: << pipeline.parameters.narration_path >>
      REQUEST_ID: << pipeline.parameters.request_id >>
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Ensure FFmpeg is available
          command: |
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            ffmpeg -version | head -n 1
      - run:
          name: Generate original audio fixtures
          command: npm run assets:audio
      - run:
          name: Validate render inputs
          command: |
            set -Eeuo pipefail
            if [[ ! "$COMPOSITION_ID" =~ ^[A-Za-z][A-Za-z0-9_-]{0,63}$ ]]; then
              echo "composition_id must be a safe Remotion composition identifier"
              exit 1
            fi
            if [[ ! "$OUTPUT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,59}$ ]]; then
              echo "output_name must contain 1-60 letters, numbers, or hyphens"
              exit 1
            fi
            if [[ -n "$PROJECT_PATH" ]]; then
              case "$PROJECT_PATH" in
                projects/*.json) ;;
                *) echo "project_path must point inside projects/"; exit 1 ;;
              esac
              if [[ "$PROJECT_PATH" == *".."* || ! -f "$PROJECT_PATH" ]]; then
                echo "project_path must be an existing JSON file without traversal segments"
                exit 1
              fi
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$PROJECT_PATH"
            fi
            if [[ -n "$NARRATION_PATH" ]]; then
              case "$NARRATION_PATH" in
                projects/*.json) ;;
                *) echo "narration_path must point inside projects/"; exit 1 ;;
              esac
              if [[ "$NARRATION_PATH" == *".."* || ! -f "$NARRATION_PATH" ]]; then
                echo "narration_path must be an existing JSON file without traversal segments"
                exit 1
              fi
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$NARRATION_PATH"
              if [[ "$COMPOSITION_ID" != "ProjectVideo" && "$COMPOSITION_ID" != "NarratedSkyExplainer" ]]; then
                echo "Narration requires ProjectVideo or NarratedSkyExplainer"
                exit 1
              fi
              node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if (p.composition?.id !== process.argv[2]) process.exit(1)' "$PROJECT_PATH" "$COMPOSITION_ID"
            fi
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              if [[ -z "$PROJECT_PATH" ]]; then
                echo "ProjectVideo requires project_path"
                exit 1
              fi
              npm run validate:project -- "$PROJECT_PATH"
            fi
            node - <<'NODE'
            const fs = require("node:fs");
            const request = {
              provider: "circleci",
              compositionId: process.env.COMPOSITION_ID,
              outputName: process.env.OUTPUT_NAME,
              requestId: process.env.REQUEST_ID,
              ...(process.env.PROJECT_PATH ? { projectPath: process.env.PROJECT_PATH } : {}),
              ...(process.env.NARRATION_PATH ? { narrationPath: process.env.NARRATION_PATH } : {}),
            };
            fs.writeFileSync("/tmp/circleci-render-request.json", JSON.stringify(request, null, 2));
            NODE
            node scripts/validate-render-strategy.mjs /tmp/circleci-render-request.json packages/video-engine/src/root.tsx
      - when:
          condition:
            not:
              equal: ["", << pipeline.parameters.narration_path >>]
          steps:
            - restore_cache:
                keys:
                  - kokoro-onnx-model-files-v1.1-linux-amd64
            - run:
                name: Generate optional narration and word alignment
                command: |
                  if ! command -v python3 >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install -y python3 python3-venv python3-pip
                  elif ! python3 -c 'import venv' >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install -y python3-venv
                  fi
                  python3 --version
                  python3 -m venv .venv-tts
                  . .venv-tts/bin/activate
                  pip install --disable-pip-version-check -r requirements-tts.txt
                  PROJECT_DIR="$(dirname "$PROJECT_PATH")"
                  mkdir -p "$PROJECT_DIR/assets/audio"
                  cp projects/sora/assets/audio/score.wav "$PROJECT_DIR/assets/audio/score.wav"
                  cp projects/showcase-motion/assets/audio/transition-whoosh.wav "$PROJECT_DIR/assets/audio/transition-whoosh.wav"
                  python scripts/generate-narration.py \
                    --config "$NARRATION_PATH" \
                    --project-dir "$PROJECT_DIR" \
                    --model-dir "$HOME/.cache/ai-video-studio/kokoro-v1.0"
                  npm run narration:apply -- "$PROJECT_PATH" "$NARRATION_PATH" "$PROJECT_DIR/production/narration-alignment.json"
                  if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
                    npm run validate:project -- "$PROJECT_DIR/.narrated-project.json"
                  else
                    node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if (!Array.isArray(p.subtitleCues) || !Number.isInteger(p.durationInFrames)) process.exit(1)' "$PROJECT_DIR/.narrated-project.json"
                  fi
                  echo "export PROJECT_PATH=$PROJECT_DIR/.narrated-project.json" >> "$BASH_ENV"
                  export PROJECT_PATH="$PROJECT_DIR/.narrated-project.json"
            - save_cache:
                key: kokoro-onnx-model-files-v1.1-linux-amd64
                paths:
                  - ~/.cache/ai-video-studio/kokoro-v1.0
      - run:
          name: Prepare project audio processing
          command: |
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              npm run audio:prepare -- "$PROJECT_PATH"
            fi
      - run:
          name: Render MP4
          command: |
            set -Eeuo pipefail
            mkdir -p render-output
            echo "Rendering request: $REQUEST_ID"
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              PROJECT_DIR="$(dirname "$PROJECT_PATH")"
              npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--props=../../$PROJECT_DIR/.render-project.json" "--public-dir=../../$PROJECT_DIR"
            elif [[ -n "$PROJECT_PATH" ]]; then
              PROJECT_DIR="$(dirname "$PROJECT_PATH")"
              if [[ "$RENDER_MODE" == "2d" ]]; then
                npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--concurrency=1" "--props=../../$PROJECT_PATH" "--public-dir=../../$PROJECT_DIR"
              else
                npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--props=../../$PROJECT_PATH" "--public-dir=../../$PROJECT_DIR" "--concurrency=1" "--gl=swangle"
              fi
            elif [[ "$RENDER_MODE" == "2d" ]]; then
              npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--concurrency=1"
            else
              npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--concurrency=1" "--gl=swangle"
            fi
      - run:
          name: Master final audio
          command: |
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              npm run audio:master -- "render-output/$OUTPUT_NAME.mp4" "$PROJECT_PATH"
            elif [[ "$COMPOSITION_ID" == "NarratedSkyExplainer" ]]; then
              ffmpeg -y -i "render-output/$OUTPUT_NAME.mp4" \
                -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
                -c:v copy -c:a aac -b:a 192k -movflags +faststart \
                "render-output/$OUTPUT_NAME.mastered.mp4"
              mv "render-output/$OUTPUT_NAME.mastered.mp4" "render-output/$OUTPUT_NAME.mp4"
            fi
      - store_artifacts:
          path: render-output
          destination: renders

workflows:
  render-video:
    when: << pipeline.parameters.render_video >>
    jobs:
      - render
