name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  check-and-still:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Render one Three.js smoke still with software WebGL
        run: npx remotion render src/index.ts RenderTechniqueSmoke out/ci-three-smoke.png --frames=30 --image-format=png --gl=swiftshader
