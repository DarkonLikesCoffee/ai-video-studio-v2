name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: write
jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-restructure
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Render references
        run: |
          mkdir -p reference
          npx remotion render src/index.ts MadridTrip out/ref-madrid --frames=60,250,450,600 --image-format=png --scale=0.6667 --gl=swangle --sequence
          npx remotion render src/index.ts TinyAstronautCrystalCave out/ref-astronaut --frames=120,350,500 --image-format=png --scale=0.6667 --gl=swangle --sequence
          i=1; for f in $(find out/ref-madrid -type f -name '*.png' | sort); do cp "$f" "reference/madrid-trip-0$i.png"; i=$((i+1)); done
          i=1; for f in $(find out/ref-astronaut -type f -name '*.png' | sort); do cp "$f" "reference/tiny-astronaut-0$i.png"; i=$((i+1)); done
      - name: Render LighthouseStorm round two
        run: |
          mkdir -p out/review/LighthouseStorm/round-2
          npx remotion render src/index.ts LighthouseStorm out/review/LighthouseStorm/round-2 --frames=0,52,104,105,157,209,210,262,314,315,367,419,420,472,524,525,562,599 --image-format=png --scale=0.6667 --gl=swangle --sequence
          mkdir -p review-log/LighthouseStorm/round-2
          cp out/review/LighthouseStorm/round-2/*.png review-log/LighthouseStorm/round-2/
          cat > review-log/LighthouseStorm/round-2/problems.md <<'EOF'
          # Round 2 — aesthetic review

          1. **The keeper still lacks a convincing full-body performance (highest impact):** the new foot rhythm helps, but the arms and torso remain too mannequin-like.
          2. **The scene geography still feels shallow:** the tower, keeper, and sea need clearer foreground/midground/background separation and atmospheric depth.
          3. **The lens repair scene is too diagrammatic:** the lens reads as a clean icon rather than a heavy optical mechanism in a believable room.

          Reference gap: MadridTrip has stronger perspective and spatial scale, while TinyAstronaut has much more dimensional character/prop lighting; LighthouseStorm remains flatter and less tactile.

          Round-two code changes addressed round-one problems #1 and #2 with animated keeper body/leg movement, tower shading, stronger water depth, and lightning-shaped storm light.

          Technical issues: none observed in this render round; typecheck and all 18 stills completed successfully.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-round-two-and-references
          path: |
            review-log/LighthouseStorm/round-2/*
            review-log/LighthouseStorm/round-1/problems.md
            reference/*.png
      - name: Commit reference frames and round one
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reference review-log/LighthouseStorm/round-1
          git commit -m "test: add composition references and lighthouse round one"
          git push origin HEAD:v2-restructure
