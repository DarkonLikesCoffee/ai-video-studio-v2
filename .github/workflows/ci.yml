name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  final-render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Final LighthouseStorm render
        run: npx remotion render src/index.ts LighthouseStorm out/LighthouseStorm.mp4 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-storm-final-v2
          path: out/LighthouseStorm.mp4
          if-no-files-found: error
          retention-days: 7
