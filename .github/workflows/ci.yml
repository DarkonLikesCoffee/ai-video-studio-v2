name: CI
# Keep CI intentionally small: typecheck and one known-good still render.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-still:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run still -- MadridTrip 0
